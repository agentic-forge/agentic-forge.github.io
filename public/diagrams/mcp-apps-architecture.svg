<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 400">
  <defs>
    <marker id="app-arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b5cf6"/>
    </marker>
    <marker id="app-arr-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
    <marker id="app-arr-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="app-arr-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="750" height="400" fill="none"/>

  <!-- Title -->
  <text x="375" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">MCP Apps: Interactive Tool UI Flow</text>

  <!-- forge-ui container -->
  <rect x="30" y="50" width="400" height="290" rx="10" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="45" y="70" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">forge-ui (Host)</text>

  <!-- Chat Window -->
  <rect x="50" y="85" width="150" height="140" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="125" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#93c5fd">Chat Window</text>

  <text x="65" y="125" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">User: Weather at my</text>
  <text x="65" y="137" font-family="system-ui, sans-serif" font-size="8" fill="#64748b">hiking spot?</text>

  <text x="65" y="157" font-family="system-ui, sans-serif" font-size="8" fill="#a5b4fc">Agent: Let me show</text>
  <text x="65" y="169" font-family="system-ui, sans-serif" font-size="8" fill="#a5b4fc">you a map...</text>

  <rect x="60" y="180" width="130" height="35" rx="4" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1"/>
  <text x="125" y="202" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#c4b5fd">pick_location called</text>

  <!-- Sandboxed iframe -->
  <rect x="220" y="85" width="195" height="180" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <text x="317" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#a7f3d0">Sandboxed iframe</text>
  <text x="317" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#6ee7b7">sandbox="allow-scripts"</text>

  <!-- Map representation inside iframe -->
  <rect x="235" y="130" width="165" height="90" rx="4" fill="#134e4a" stroke="#2dd4bf" stroke-width="1"/>
  <text x="317" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5eead4">Location Picker App</text>

  <!-- Map grid lines -->
  <line x1="250" y1="170" x2="385" y2="170" stroke="#2dd4bf" stroke-width="0.5" opacity="0.3"/>
  <line x1="250" y1="190" x2="385" y2="190" stroke="#2dd4bf" stroke-width="0.5" opacity="0.3"/>
  <line x1="290" y1="145" x2="290" y2="210" stroke="#2dd4bf" stroke-width="0.5" opacity="0.3"/>
  <line x1="345" y1="145" x2="345" y2="210" stroke="#2dd4bf" stroke-width="0.5" opacity="0.3"/>

  <!-- Map marker -->
  <circle cx="320" cy="180" r="6" fill="#f43f5e" stroke="#fda4af" stroke-width="1"/>

  <!-- Search box in map -->
  <rect x="245" y="195" width="80" height="16" rx="3" fill="#0d3d3d" stroke="#2dd4bf" stroke-width="0.5"/>
  <text x="250" y="206" font-family="system-ui, sans-serif" font-size="7" fill="#94a3b8">Search...</text>

  <!-- User click button -->
  <rect x="335" y="195" width="55" height="16" rx="3" fill="#0d3d3d" stroke="#2dd4bf" stroke-width="0.5"/>
  <text x="362" y="206" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#5eead4">Select</text>

  <!-- Continue button -->
  <rect x="235" y="230" width="80" height="25" rx="4" fill="#8b5cf6" stroke="#a78bfa" stroke-width="1"/>
  <text x="275" y="247" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#ffffff">Continue</text>

  <!-- Context display -->
  <rect x="325" y="230" width="75" height="25" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="362" y="243" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#a5b4fc">lat: 51.5, lng: -0.1</text>
  <text x="362" y="253" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#a5b4fc">London, UK</text>

  <!-- postMessage label -->
  <rect x="220" y="272" width="195" height="22" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
  <text x="317" y="287" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#fcd34d">postMessage (JSON-RPC)</text>

  <!-- Arrow from chat to iframe -->
  <path d="M 200 160 L 220 160" stroke="#8b5cf6" stroke-width="2" marker-end="url(#app-arr)"/>

  <!-- Backend Stack -->
  <rect x="470" y="50" width="260" height="290" rx="10" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="485" y="70" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Backend Stack</text>

  <!-- Orchestrator -->
  <rect x="490" y="85" width="120" height="55" rx="8" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="550" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#c4b5fd">Orchestrator</text>
  <text x="550" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">proxies tool calls</text>

  <!-- Armory -->
  <rect x="490" y="160" width="120" height="55" rx="8" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="550" y="183" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#c4b5fd">Armory</text>
  <text x="550" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">ui:// routing</text>

  <!-- MCP Server -->
  <rect x="490" y="235" width="120" height="70" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="2"/>
  <text x="550" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#fcd34d">mcp-weather</text>
  <text x="550" y="275" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#fbbf24">pick_location tool</text>
  <text x="550" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#fbbf24">ui://location-picker</text>

  <!-- Resource bubble -->
  <rect x="625" y="180" width="90" height="65" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <text x="670" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#a7f3d0">Resource</text>
  <text x="670" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#6ee7b7">index.html</text>
  <text x="670" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#94a3b8">Vue + Leaflet.js</text>

  <!-- Arrows between backend components -->
  <line x1="550" y1="140" x2="550" y2="160" stroke="#8b5cf6" stroke-width="2" marker-end="url(#app-arr)"/>
  <line x1="550" y1="215" x2="550" y2="235" stroke="#8b5cf6" stroke-width="2" marker-end="url(#app-arr)"/>
  <line x1="610" y1="270" x2="625" y2="230" stroke="#10b981" stroke-width="2" marker-end="url(#app-arr-green)"/>

  <!-- Arrow from postMessage to orchestrator -->
  <path d="M 415 283 L 450 283 L 450 112 L 490 112" stroke="#f59e0b" stroke-width="2" marker-end="url(#app-arr-orange)"/>

  <!-- Arrow from iframe fetch to resource -->
  <path d="M 415 165 L 670 165 L 670 180" stroke="#10b981" stroke-width="2" marker-end="url(#app-arr-green)"/>
  <text x="540" y="158" font-family="system-ui, sans-serif" font-size="7" fill="#6ee7b7">fetch HTML</text>

  <!-- Flow numbers -->
  <circle cx="60" cy="200" r="10" fill="#3b82f6"/>
  <text x="60" y="204" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#ffffff">1</text>

  <circle cx="317" cy="140" r="10" fill="#10b981"/>
  <text x="317" y="144" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#ffffff">2</text>

  <circle cx="320" cy="180" r="10" fill="#f59e0b"/>
  <text x="320" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#ffffff">3</text>

  <circle cx="275" cy="242" r="10" fill="#8b5cf6"/>
  <text x="275" y="246" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#ffffff">4</text>

  <!-- Legend -->
  <g transform="translate(50, 355)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Flow:</text>
    <circle cx="50" cy="-4" r="8" fill="#3b82f6"/>
    <text x="50" y="0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#ffffff">1</text>
    <text x="65" y="0" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">Tool call with _meta.ui</text>

    <circle cx="190" cy="-4" r="8" fill="#10b981"/>
    <text x="190" y="0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#ffffff">2</text>
    <text x="205" y="0" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">Render app in iframe</text>

    <circle cx="340" cy="-4" r="8" fill="#f59e0b"/>
    <text x="340" y="0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#ffffff">3</text>
    <text x="355" y="0" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">User selects location</text>

    <circle cx="490" cy="-4" r="8" fill="#8b5cf6"/>
    <text x="490" y="0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#ffffff">4</text>
    <text x="505" y="0" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">updateModelContext → Continue</text>
  </g>
</svg>
